# Constraints for the Competitive Analysis Kit artifact kinds.
# Deterministic validation contract consumed by `cfs validate`.
#
# Traceability backbone: RESEARCH-REQUEST is the root artifact. Every
# downstream kind (CANDIDATE-REGISTER, COMPANY-PROFILE, COMPANY-DOSSIER,
# COMPARISON-MATRIX — added in later kit versions) declares a coverage
# reference back to the request's Traceability section, so every research
# artifact remains attributable to the request that commissioned it.

# ── RESEARCH-REQUEST Heading outline ──────────────────────────────────

[[artifacts."RESEARCH-REQUEST".headings]]
id = "req-h1-title"
level = 1
required = true
multiple = false
numbered = false
pattern = 'Research Request\s*[—–-]\s*.+'
description = "Research request title (H1): 'Research Request — {target}'."

[[artifacts."RESEARCH-REQUEST".headings]]
id = "req-fields"
level = 2
required = true
multiple = false
numbered = true
pattern = "Request Fields"
description = "The eight request fields (target, decision question, scope, comparison frame, depth, requested output, evidence cutoff, access boundary); omitted fields carry the literal value 'unspecified'."

[[artifacts."RESEARCH-REQUEST".headings]]
id = "req-boundary"
level = 2
required = true
multiple = false
numbered = true
pattern = "Boundary"
description = "What this request can and cannot establish; a discovery scan is not a feature-parity or buy/build result."

[[artifacts."RESEARCH-REQUEST".headings]]
id = "req-evidence"
level = 2
required = true
multiple = false
numbered = true
pattern = "Evidence and Original Files"
description = "The original request text and any named input sources (evidence locators when already indexed)."

[[artifacts."RESEARCH-REQUEST".headings]]
id = "req-traceability"
level = 2
required = true
multiple = false
numbered = true
pattern = "Traceability"
description = "Back-links to artifacts derived from this request (required section; holds the mandatory downstream back-references)."

# ── RESEARCH-REQUEST Identifiers ──────────────────────────────────────

[artifacts."RESEARCH-REQUEST".identifiers.req]
name = "Competitive-Research Request"
description = "One structured competitive-research request: what question must be answered, at which depth, within which evidence boundary."
required = true
task = false
priority = false
to_code = false
template = "cpt-{system}-req-{slug}"
headings = ["req-h1-title"]

